<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f2147">
<title>Sem conexão · Intercert ERP</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f7fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0f172a}
  .card{max-width:420px;margin:24px;padding:32px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;text-align:center}
  .logo{width:56px;height:56px;margin:0 auto 16px;border-radius:14px;background:#f2711c;color:#fff;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center}
  h1{font-size:20px;margin:0 0 8px} p{color:#475569;font-size:14px;line-height:1.5;margin:0 0 20px}
  button{background:#183772;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">IC</div>
    <h1>Sem conexão com a internet</h1>
    <p>O Intercert ERP precisa de conexão para registrar vendas, estoque e financeiro com segurança. Nada foi gravado enquanto você estava offline. Verifique a rede e tente novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
